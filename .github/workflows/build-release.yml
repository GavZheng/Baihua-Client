# The three ends release independently: `baihua` (cli-v<version>), `baihua-gui`
# (gui-v<version>) and `baihua-tui` (tui-v<version>). Versions, tags and packages are
# separate, and one end builds and publishes only while its tag does not exist yet.
#
# The version comes from each package's own Cargo.toml, the notes from its changelog:
#   baihua-cli/Cargo.toml          + CHANGELOG_CLI.md   -> cli-v<version>
#   baihua-client-gui/Cargo.toml   + CHANGELOG_GUI.md   -> gui-v<version>
#   baihua-client-tui/Cargo.toml   + CHANGELOG_TUI.md   -> tui-v<version>
#
# Updating one changelog and one package version therefore releases that end only,
# while a change touching several packages releases each of them side by side.
#
# An end releases when both hold: its Cargo.toml version has a `## [version]` section
# in its changelog, and that tag does not exist yet. Code without a changelog section
# stays unpublished (the prepare job logs a warning), so a push never releases by accident.
# Artifacts of every build:
#   baihua-cli-<version>-<target>.tar.gz / .zip  (holding `baihua` and config/)
#   baihua-gui-<version>-<target>.tar.gz / .zip  (holding `baihua-gui` and config/)
#   baihua-tui-<version>-<target>.tar.gz / .zip  (holding `baihua-tui` and config/)
# Each package carries a matching .sha256 digest, which the client verifies before updating.

name: Build Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Read each end's version, changelog and existing tags, decide which ends release,
  # and build the (end x target) matrix for the build job. The criterion is "the tag
  # of that version does not exist yet", so one version is never published twice.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.metadata.outputs.build_matrix }}
      cli_release: ${{ steps.metadata.outputs.cli_release }}
      cli_tag: ${{ steps.metadata.outputs.cli_tag }}
      cli_prerelease: ${{ steps.metadata.outputs.cli_prerelease }}
      cli_changelog: ${{ steps.metadata.outputs.cli_changelog }}
      gui_release: ${{ steps.metadata.outputs.gui_release }}
      gui_tag: ${{ steps.metadata.outputs.gui_tag }}
      gui_prerelease: ${{ steps.metadata.outputs.gui_prerelease }}
      gui_changelog: ${{ steps.metadata.outputs.gui_changelog }}
      tui_release: ${{ steps.metadata.outputs.tui_release }}
      tui_tag: ${{ steps.metadata.outputs.tui_tag }}
      tui_prerelease: ${{ steps.metadata.outputs.tui_prerelease }}
      tui_changelog: ${{ steps.metadata.outputs.tui_changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The existing tags are needed to tell whether this version was released
          fetch-depth: 0

      - name: Read versions, changelogs and existing tags
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          # Read the version out of one package's Cargo.toml
          read_version() {
            local manifest_path="$1"
            if [ ! -f "$manifest_path" ]; then
              return
            fi
            grep -m1 '^version' "$manifest_path" | sed 's/.*"\(.*\)".*/\1/'
          }

          # Take the changelog section of this version: `## [version]` up to the next one
          read_changelog_section() {
            local changelog_path="$1"
            local version="$2"
            if [ ! -f "$changelog_path" ]; then
              return
            fi
            awk -v version="$version" '
              /^## \[/ {
                if (found) { exit }
                if (index($0, "[" version "]")) { found = 1 }
                next
              }
              found { print }
            ' "$changelog_path"
          }

          # Targets: five fields are triplet, runner, archive suffix,
          # executable suffix and the installer kind for that target.
          target_specifications=(
            "aarch64-apple-darwin|macos-latest|tar.gz||dmg"
            "x86_64-apple-darwin|macos-latest|tar.gz||dmg"
            "x86_64-pc-windows-msvc|windows-latest|zip|.exe|msi"
            "x86_64-unknown-linux-gnu|ubuntu-latest|tar.gz||appimage"
            "aarch64-linux-android|ubuntu-latest|apk||apk"
            "aarch64-apple-ios|macos-latest|ipa||ipa"
          )

          # Ends: seven fields are product, package, tag prefix, package prefix,
          # binary, changelog and the bundle name an installer package uses.
          product_specifications=(
            "cli|baihua-cli|cli-v|baihua-cli-|baihua|CHANGELOG_CLI.md"
            "gui|baihua-client-gui|gui-v|baihua-gui-|baihua-gui|CHANGELOG_GUI.md|Baihua"
            "tui|baihua-client-tui|tui-v|baihua-tui-|baihua-tui|CHANGELOG_TUI.md"
          )

          build_matrix_entries=""
          append_matrix_entry() {
            if [ -n "$build_matrix_entries" ]; then
              build_matrix_entries="${build_matrix_entries},"
            fi
            build_matrix_entries="${build_matrix_entries}${1}"
          }

          for product_specification in "${product_specifications[@]}"; do
            IFS='|' read -r product package_directory tag_prefix package_prefix executable_name changelog_file bundle_name <<< "$product_specification"
            version="$(read_version "${package_directory}/Cargo.toml")"
            if [ -z "$version" ]; then
              echo "::error::cannot read the version from ${package_directory}/Cargo.toml"
              exit 1
            fi
            tag="${tag_prefix}${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              release="false"
            else
              release="true"
            fi
            case "$version" in
              *alpha*|*beta*|*rc*) prerelease="true" ;;
              *) prerelease="false" ;;
            esac
            changelog_body="$(read_changelog_section "$changelog_file" "$version")"
            if [ -z "$changelog_body" ]; then
              # No changelog section for this version means the end is not ready to
              # release: skip it and log a warning, so a push never releases by accident.
              if [ "$release" = "true" ]; then
                echo "::warning::${changelog_file} has no section for ${version}; the ${product} end is not released this time"
              fi
              release="false"
            fi
            {
              echo "${product}_release=${release}"
              echo "${product}_tag=${tag}"
              echo "${product}_prerelease=${prerelease}"
              echo "${product}_version=${version}"
              echo "${product}_changelog<<CHANGELOG_END"
              echo "$changelog_body"
              echo "CHANGELOG_END"
            } >> "$GITHUB_OUTPUT"
            echo "${product}: version ${version}, tag ${tag}, release ${release}"
            if [ "$release" = "true" ]; then
              for target_specification in "${target_specifications[@]}"; do
                IFS='|' read -r target runner archive_extension executable_extension package_kind <<< "$target_specification"
                case "$package_kind" in
                  apk|ipa)
                    # Phone installers exist for the graphical end only: the
                    # command line and terminal ends keep the desktop triples.
                    [ "$product" = "gui" ] || continue
                    ;;
                esac
                append_matrix_entry "{\"product\":\"${product}\",\"package\":\"${package_directory}\",\"binary\":\"${executable_name}${executable_extension}\",\"version\":\"${version}\",\"tag\":\"${tag}\",\"package_prefix\":\"${package_prefix}\",\"target\":\"${target}\",\"runner\":\"${runner}\",\"package_kind\":\"${package_kind}\",\"bundle_name\":\"${bundle_name}\",\"archive_extension\":\"${archive_extension}\",\"standalone\":\"${package_prefix}${version}-${target}${executable_extension}\"}"
              done
            fi
          done
          echo "build_matrix=[${build_matrix_entries}]" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Formatting, clippy and tests run on every push, release or not
  # ---------------------------------------------------------------------------
  check:
    name: Lint and test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # The build matrix holds only the ends releasing now, one runner per target
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.product }} for ${{ matrix.target }}
    needs: [prepare, check]
    if: needs.prepare.outputs.build_matrix != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.product }}-${{ matrix.target }}

      - name: Build release binary
        if: matrix.package_kind != 'apk' && matrix.package_kind != 'ipa'
        run: cargo build --release -p ${{ matrix.package }} --target ${{ matrix.target }}

      # -- Packaging (Unix) ----------------------------------------------------
      - name: Package (Unix)
        if: runner.os != 'Windows' && matrix.bundle_name == ''
        shell: bash
        run: |
          archive="${{ matrix.package_prefix }}${{ matrix.version }}-${{ matrix.target }}.tar.gz"
          staging="staging-${{ matrix.target }}"

          mkdir -p "${staging}/config"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${staging}/"
          cp -R config/. "${staging}/config/"

          tar -czf "${archive}" -C "${staging}" .
          shasum -a 256 "${archive}" > "${archive}.sha256"

          echo "archive=${archive}" >> "$GITHUB_ENV"
          rm -rf "${staging}"

      # -- Packaging (Windows) -------------------------------------------------
      - name: Package (Windows)
        if: runner.os == 'Windows' && matrix.bundle_name == ''
        shell: pwsh
        run: |
          $archive = "${{ matrix.package_prefix }}${{ matrix.version }}-${{ matrix.target }}.zip"
          $staging = "staging-${{ matrix.target }}"

          New-Item -ItemType Directory -Force "${staging}\config" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" "${staging}\"
          Copy-Item -Recurse config\* "${staging}\config\"

          Compress-Archive -Path "${staging}\*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "${hash}  ${archive}" | Set-Content "${archive}.sha256"

          echo "archive=${archive}" >> $env:GITHUB_ENV
          Remove-Item -Recurse -Force $staging

      # -- Toolchains only installer kinds need (each cheap, each conditional) --
      - name: Install the Windows installer builder
        if: matrix.bundle_name != '' && matrix.package_kind == 'msi'
        shell: bash
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Install the Android toolchain
        if: matrix.bundle_name != '' && matrix.package_kind == 'apk'
        shell: bash
        run: |
          cargo install cargo-apk --locked
          # The runner image ships an NDK already; install one only when none
          # exists. sdkmanager lives under cmdline-tools, not on the PATH.
          if ! ls "${ANDROID_HOME}/ndk" > /dev/null 2>&1; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;27.2.12479018" > /dev/null
          fi

      - name: Install the macOS disk image builder
        if: matrix.bundle_name != '' && matrix.package_kind == 'dmg'
        shell: bash
        run: |
          python3 -m venv "$HOME/dmgbuild-environment"
          "$HOME/dmgbuild-environment/bin/pip" install dmgbuild
          echo "DMGBUILD_PYTHON=$HOME/dmgbuild-environment/bin/python3" >> "$GITHUB_ENV"

      - name: Install the Linux AppImage builder
        if: matrix.bundle_name != '' && matrix.package_kind == 'appimage'
        shell: bash
        run: |
          curl -fL -o "$HOME/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-x86_64.AppImage
          chmod +x "$HOME/linuxdeploy"
          echo "LINUXDEPLOY=$HOME/linuxdeploy" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      # -- Bundle ends: one installer package per platform --------------
      # Every kind routes through scripts/build_packages.sh, the same entry a
      # developer runs locally, so CI and the machine can never diverge.
      - name: Package the installer bundle
        if: matrix.bundle_name != ''
        shell: bash
        run: |
          case "${{ matrix.package_kind }}" in
            dmg)
              case "${{ matrix.target }}" in
                aarch64*) arch=arm ;;
                *) arch=x86 ;;
              esac
              scripts/build_packages.sh --end gui --platform mac --arch "$arch"
              ;;
            msi) scripts/build_packages.sh --end gui --platform windows ;;
            appimage) scripts/build_packages.sh --end gui --platform linux ;;
            apk) scripts/build_packages.sh --end gui --platform android ;;
            ipa) scripts/build_packages.sh --end gui --platform ios ;;
          esac

      # Installer scripts record the package as dist/<file>; the artifact name
      # must be the bare file, so strip the directory in a step of its own.
      - name: Record the installer package name
        if: matrix.bundle_name != ''
        shell: bash
        run: echo "archive_name=${archive##*/}" >> "$GITHUB_ENV"

      # -- Upload the package and its digest -----------------------------------
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_name || env.archive }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
          retention-days: 30

      # -- Upload the standalone executable (for a direct download) -------------
      - name: Stage standalone executable
        if: matrix.bundle_name == ''
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.standalone }}"

      - name: Upload standalone executable
        if: matrix.bundle_name == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.standalone }}
          path: ${{ matrix.standalone }}
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Each end publishes on its own; the job is skipped entirely when it is not releasing
  # ---------------------------------------------------------------------------
  release-cli:
    name: Publish command line release
    needs: [prepare, build]
    if: needs.prepare.outputs.cli_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download command line artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: baihua-cli-*
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          ls -lh artifacts/
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "::error::no artifact was downloaded for the command line end"
            exit 1
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.cli_tag }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.cli_prerelease }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.cli_changelog }}
        shell: bash
        run: |
          release_notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s' "$RELEASE_NOTES" > "${release_notes_file}"

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

          release_arguments=(
            "$RELEASE_TAG"
            "--title" "$RELEASE_TAG"
            "--notes-file" "${release_notes_file}"
          )
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_arguments+=("--prerelease")
          fi
          for release_asset in artifacts/*; do
            release_arguments+=("$release_asset")
          done
          gh release create "${release_arguments[@]}"

  release-gui:
    name: Publish graphical release
    needs: [prepare, build]
    if: needs.prepare.outputs.gui_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download graphical artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: baihua-gui-*
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          ls -lh artifacts/
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "::error::no artifact was downloaded for the graphical end"
            exit 1
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.gui_tag }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.gui_prerelease }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.gui_changelog }}
        shell: bash
        run: |
          release_notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s' "$RELEASE_NOTES" > "${release_notes_file}"

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

          release_arguments=(
            "$RELEASE_TAG"
            "--title" "$RELEASE_TAG"
            "--notes-file" "${release_notes_file}"
          )
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_arguments+=("--prerelease")
          fi
          for release_asset in artifacts/*; do
            release_arguments+=("$release_asset")
          done
          gh release create "${release_arguments[@]}"

  release-tui:
    name: Publish terminal release
    needs: [prepare, build]
    if: needs.prepare.outputs.tui_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download terminal artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: baihua-tui-*
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          ls -lh artifacts/
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "::error::no artifact was downloaded for the terminal end"
            exit 1
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tui_tag }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.tui_prerelease }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.tui_changelog }}
        shell: bash
        run: |
          release_notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s' "$RELEASE_NOTES" > "${release_notes_file}"

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

          release_arguments=(
            "$RELEASE_TAG"
            "--title" "$RELEASE_TAG"
            "--notes-file" "${release_notes_file}"
          )
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_arguments+=("--prerelease")
          fi
          for release_asset in artifacts/*; do
            release_arguments+=("$release_asset")
          done
          gh release create "${release_arguments[@]}"
